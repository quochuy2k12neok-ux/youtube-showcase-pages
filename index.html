<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Showcase | YouTube Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="left-section">
            <i class="fas fa-bars menu-icon"></i>
            <div class="logo"><i class="fab fa-youtube"></i> <span>Showcase</span></div>
        </div>
        <div class="mid-section">
            <div class="search-box">
                <input type="text" placeholder="Tìm kiếm dự án...">
                <button><i class="fas fa-search"></i></button>
            </div>
            <div class="mic-icon"><i class="fas fa-microphone"></i></div>
        </div>
        <div class="right-section">
            <i class="fas fa-video"></i>
            <i class="fas fa-bell"></i>
            <div class="user-avatar">G</div>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="nav-link active"><i class="fas fa-home"></i> <span>Trang chủ</span></div>
            <div class="nav-link"><i class="fab fa-staylinked"></i> <span>Shorts</span></div>
            <div class="nav-link"><i class="fas fa-layer-group"></i> <span>Đăng ký</span></div>
            <hr>
            <div class="nav-link"><i class="fas fa-history"></i> <span>Lịch sử</span></div>
            <div class="nav-link"><i class="fas fa-clock"></i> <span>Xem sau</span></div>
        </aside>

        <main class="content">
            <div id="category-bar" class="category-bar"></div>
            <div id="video-grid" class="video-grid">
                </div>
        </main>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
