<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Pro 2026</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <i class="fas fa-bars" style="font-size: 20px;"></i>
            <div style="font-weight: bold; font-size: 20px; display: flex; align-items: center; gap: 5px;">
                <i class="fab fa-youtube" style="color: red; font-size: 28px;"></i> YouTube
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Tìm kiếm...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>

        <div style="display: flex; gap: 20px; font-size: 20px;">
            <i class="fas fa-video"></i>
            <i class="fas fa-bell"></i>
            <div style="width: 32px; height: 32px; background: purple; border-radius: 50%; text-align: center; line-height: 32px; font-size: 16px;">G</div>
        </div>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="nav-item active" id="btn-home">
                <i class="fas fa-home"></i> <span>Trang chủ</span>
            </div>
            <div class="nav-item" id="btn-shorts">
                <i class="fas fa-bolt"></i> <span>Shorts</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-photo-video"></i> <span>Kênh đăng ký</span>
            </div>
            <hr style="border-color: #333; margin: 12px 0;">
            <div class="nav-item"><i class="fas fa-history"></i> Video đã xem</div>
            <div class="nav-item"><i class="far fa-clock"></i> Xem sau</div>
        </div>

        <div class="content">
            <div id="category-bar"></div> <div id="video-container"></div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
